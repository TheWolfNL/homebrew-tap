name: Bump cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Released version without the v prefix, e.g. 0.1.0"
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      CASK: Casks/yubi-ki-yay.rb
    steps:
      - uses: actions/checkout@v4

      - name: Download release and compute sha256
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "invalid version: $VERSION"; exit 1; }
          base="https://github.com/TheWolfNL/yubi-ki-yay/releases/download/v${VERSION}"
          zip="Yubi-Ki-Yay-${VERSION}-universal.zip"
          curl -fsSL -o "$RUNNER_TEMP/$zip" "$base/$zip"
          curl -fsSL -o "$RUNNER_TEMP/$zip.sha256" "$base/$zip.sha256"
          sha=$(sha256sum "$RUNNER_TEMP/$zip" | cut -d' ' -f1)
          published=$(cut -d' ' -f1 "$RUNNER_TEMP/$zip.sha256")
          [ "$sha" = "$published" ] || { echo "sha256 mismatch: $sha != $published"; exit 1; }
          echo "SHA256=$sha" >> "$GITHUB_ENV"

      - name: Update cask
        run: |
          perl -pi -e 's/^  version ".*"/  version "$ENV{VERSION}"/; s/^  sha256 ".*"/  sha256 "$ENV{SHA256}"/; $_ = "" if /^  # Placeholder:/' "$CASK"
          git diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK"
          git diff --cached --quiet && { echo "cask already at $VERSION"; exit 0; }
          git commit -m "yubi-ki-yay ${VERSION}"
          git push
